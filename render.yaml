# Render blueprint for the Hundo FastAPI backend (Step 15.1).
# Deploy: push to GitHub, then "New > Blueprint" in Render and point it here.
# Secrets are declared with sync:false so Render prompts you to paste them
# (they are NOT stored in this file). Set CORS_ORIGINS to your Vercel URL once
# the frontend is deployed.
services:
  - type: web
    name: hundo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Required secrets (paste in the Render dashboard) ──
      - key: STEAM_API_KEY
        sync: false
      - key: LLM_API_KEY          # DeepSeek API key (see DEEPSEEK_BASE_URL)
        sync: false
      - key: TAVILY_API_KEY       # how-to + time-to-complete web search
        sync: false
      # ── Object storage (Supabase Storage, Step 15.2) ──
      - key: SUPABASE_URL          # https://<project>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_KEY  # service_role key (server-only secret)
        sync: false
      # ── Redis (Upstash REST, Step 15.3) — rate-limit + build-lock ──
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ── Wiring (set after the Vercel frontend exists) ──
      - key: CORS_ORIGINS         # e.g. https://hundo.vercel.app
        sync: false
      - key: PUBLIC_API_URL       # this service's own URL, e.g. https://hundo-api.onrender.com
        sync: false               # required for Steam OpenID return_to (proxy hides https otherwise)
      # FRONTEND_URL is optional — defaults to the first CORS_ORIGINS entry.
      # ── Optional overrides ──
      - key: STEAM_ID             # default profile; per-request resolution makes this optional
        sync: false
      - key: HUNDO_TRACING        # "true" to enable LangSmith (needs LANGSMITH_API_KEY)
        value: "false"
      - key: EXEC_TIMEOUT_SECONDS # sandbox hard timeout; the 10s default is too short on
        value: "30"               # the free tier's 0.1 CPU (charts/audit silently timed out)
      # Other tunables read by config.py — all optional, defaults shown; add a
      # `- key: … / value: "…"` entry here to pin one (see .env.example for meaning):
      #   EXEC_MEMORY_MB=2048            LLM_MAX_TOKENS=4096
      #   DEEPSEEK_BASE_URL=https://api.deepseek.com
      #   DEEPSEEK_MODEL_PRO=deepseek-v4-pro   DEEPSEEK_MODEL_FLASH=deepseek-v4-flash
      #   ROADMAP_ENGINE=deterministic   (set "codegen" to demo the code-writing path)
      #   RATE_LIMIT_ASK_PER_MIN=15      RATE_LIMIT_ASK_PER_DAY=150   RATE_LIMIT_SESSION_PER_MIN=10
      #   RATE_LIMIT_CHART_PER_MIN=10    RATE_LIMIT_CHART_PER_DAY=100
      #   RATE_LIMIT_READ_PER_MIN=30     RATE_LIMIT_STATUS_PER_MIN=90
      #   MAX_QUESTION_CHARS=1000        MAX_HISTORY_TURNS=6          MAX_HISTORY_ANSWER_CHARS=600
      #   ANSWER_CACHE_TTL_SECONDS=21600 SEARCH_CACHE_TTL_DAYS=14
      #   SNAPSHOT_LOCK_TTL=90           SNAPSHOT_WAIT_MAX=900        SNAPSHOT_TTL_DAYS=30
      #   SUPABASE_BUCKET_CHARTS=hundo-charts  SUPABASE_BUCKET_SNAPSHOTS=hundo-snapshots
      #   CHART_TTL_HOURS=6              CHART_MAX_FILES=50
      #   FRONTEND_URL (defaults to the first CORS_ORIGINS entry)   LANGSMITH_API_KEY
